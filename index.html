<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickhandling MR</title>
<style>
  html, body { margin:0; height:100%; background:#0b1220; color:#fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; text-align:center; padding:24px; }
  h1 { margin:0; font-size:2rem; letter-spacing:.04em; }
  p { margin:0; max-width:34rem; color:#9fb3d1; line-height:1.4; }
  button#enter { font-size:1.4rem; font-weight:700; padding:18px 36px; border:0; border-radius:14px;
    background:#e63946; color:#fff; cursor:pointer; }
  button#enter:disabled { background:#3a4558; cursor:not-allowed; }
  #msg { color:#ffd166; min-height:1.2em; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <h1>🏒 Stickhandling MR</h1>
  <p>Clear your floor, put on your Quest 3, and tap below. Defenders and pylons will slide toward your feet in the
     left, middle and right lanes &mdash; read them early and stickhandle around them. Point a controller (or pinch with
     your hand) at the floating panel to start.</p>
  <button id="enter" disabled>Checking MR support…</button>
  <div id="msg"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================== CONFIG ============================== */
const CONFIG = {
  spawnDistance: 4.0,          // metres in front of the player
  despawnZ: 0.9,               // metres past the player's feet (behind) before removal
  lanes: [-0.6, 0, 0.6],       // Left, Middle, Right (metres)
  baseSpeed: 0.7,              // m/s at level 0
  speedStep: 0.3,              // extra m/s per level
  minLevel: 1,
  maxLevel: 10,
  startLevel: 2,
  spawnIntervalBase: 2.6,      // seconds between spawns at level 0
  spawnIntervalPerLevel: 0.2,  // seconds shaved off per level
  spawnIntervalMin: 0.7,
  panelWidth: 1.0,             // metres
  panelDistance: 1.0,          // metres in front of the player
  panelHeightOffset: -0.12     // relative to head height at (re)center
};

/* ============================== STATE ============================== */
const state = {
  mode: 'idle',                // idle | running | paused
  level: CONFIG.startLevel,
  elapsed: 0,
  passed: 0,
  spawnTimer: 0,
  needsPlace: true,
  hovered: null
};
const speedFor = lvl => CONFIG.baseSpeed + lvl * CONFIG.speedStep;
const intervalFor = lvl => Math.max(CONFIG.spawnIntervalMin,
  CONFIG.spawnIntervalBase - lvl * CONFIG.spawnIntervalPerLevel);

/* ============================== THREE SETUP ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);          // transparent => passthrough shows through
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor'); // Y = 0 is the real floor
renderer.xr.setFoveation(0.5);
renderer.domElement.style.display = 'none';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();              // no background => passthrough
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 30);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1.5, 4, 1);
scene.add(sun);

/* "world" is re-anchored to where the player stands and faces on start / recenter.
   Inside it: player at origin, forward is -Z, floor is Y = 0. */
const world = new THREE.Group();
scene.add(world);

/* ---------- floor lane guides (semi-transparent so real tiles stay visible) ---------- */
const guideMat = new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.18,
  depthWrite: false, side: THREE.DoubleSide });
const laneW = 0.5;
CONFIG.lanes.forEach(x => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(laneW, CONFIG.spawnDistance + CONFIG.despawnZ), guideMat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.002, -(CONFIG.spawnDistance - CONFIG.despawnZ) / 2);
  world.add(m);
});
const ring = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.32, 48),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.003;
world.add(ring);

/* ---------- obstacle prefabs (shared geometry/material) ---------- */
const matRed    = new THREE.MeshStandardMaterial({ color: 0xd62828, roughness: 0.55 });
const matDark   = new THREE.MeshStandardMaterial({ color: 0x7a1010, roughness: 0.6 });
const matOrange = new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.5 });
const matWhite  = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 });
const matShadow = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false });

const geo = {
  defBody: new THREE.CylinderGeometry(0.17, 0.2, 0.85, 28),
  defTop:  new THREE.CylinderGeometry(0.17, 0.17, 0.06, 28),
  defHead: new THREE.SphereGeometry(0.13, 20, 16),
  cone:    new THREE.ConeGeometry(0.16, 0.5, 28),
  coneBase:new THREE.BoxGeometry(0.34, 0.03, 0.34),
  coneBand:new THREE.CylinderGeometry(0.085, 0.115, 0.1, 28),
  block:   new THREE.BoxGeometry(0.5, 0.36, 0.2),
  stripe:  new THREE.BoxGeometry(0.1, 0.362, 0.202),
  shadow:  new THREE.CircleGeometry(0.28, 24)
};

function makeDefender() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(geo.defBody, matRed); body.position.y = 0.425; g.add(body);
  const top = new THREE.Mesh(geo.defTop, matDark); top.position.y = 0.85; g.add(top);
  const head = new THREE.Mesh(geo.defHead, matDark); head.position.y = 0.98; g.add(head);
  return g;
}
function makePylon() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(geo.coneBase, matOrange); base.position.y = 0.015; g.add(base);
  const cone = new THREE.Mesh(geo.cone, matOrange); cone.position.y = 0.28; g.add(cone);
  const band = new THREE.Mesh(geo.coneBand, matWhite); band.position.y = 0.26; g.add(band);
  return g;
}
function makeBlock() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(geo.block, matRed); b.position.y = 0.18; g.add(b);
  [-0.15, 0.15].forEach(x => {
    const s = new THREE.Mesh(geo.stripe, matWhite); s.position.set(x, 0.18, 0); g.add(s);
  });
  return g;
}
const prefabs = [makeDefender, makePylon, makeBlock];

/* ---------- obstacle management ---------- */
const obstacles = [];
let lastLane = -1;

function spawnObstacle() {
  let lane = Math.floor(Math.random() * CONFIG.lanes.length);
  if (lane === lastLane && Math.random() < 0.4) lane = (lane + 1 + Math.floor(Math.random() * 2)) % CONFIG.lanes.length;
  lastLane = lane;

  const obj = prefabs[Math.floor(Math.random() * prefabs.length)]();
  const shadow = new THREE.Mesh(geo.shadow, matShadow);
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.004; obj.add(shadow);

  obj.position.set(CONFIG.lanes[lane], 0, -CONFIG.spawnDistance);
  obj.userData.age = 0;
  obj.scale.setScalar(0.01);
  world.add(obj);
  obstacles.push(obj);
}
function clearObstacles() {
  obstacles.forEach(o => world.remove(o));
  obstacles.length = 0;
}

/* ============================== UI PANEL ============================== */
const CW = 1024, CH = 512;
const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
const ctx = canvas.getContext('2d');
const panelTex = new THREE.CanvasTexture(canvas);
panelTex.colorSpace = THREE.SRGBColorSpace;
panelTex.anisotropy = 4;

const panel = new THREE.Mesh(
  new THREE.PlaneGeometry(CONFIG.panelWidth, CONFIG.panelWidth * CH / CW),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, toneMapped: false, side: THREE.DoubleSide })
);
world.add(panel);

const buttons = [
  { id: 'slower',  x: 40,  y: 235, w: 200, h: 115, label: '−  SPEED' },
  { id: 'toggle',  x: 262, y: 235, w: 500, h: 115, label: '' },
  { id: 'faster',  x: 784, y: 235, w: 200, h: 115, label: 'SPEED  +' },
  { id: 'reset',   x: 40,  y: 375, w: 300, h: 90,  label: 'RESET' },
  { id: 'recenter',x: 684, y: 375, w: 300, h: 90,  label: 'RECENTER' }
];

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const fmtTime = t => {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + d;
};

let lastTimerText = '';
function drawPanel() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(10,18,34,0.88)';
  rr(0, 0, CW, CH, 36); ctx.fill();
  ctx.strokeStyle = 'rgba(76,201,240,0.8)'; ctx.lineWidth = 5;
  rr(3, 3, CW - 6, CH - 6, 34); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9fb3d1'; ctx.font = '600 34px system-ui, sans-serif';
  ctx.fillText('STICKHANDLING TRAINER', CW / 2, 42);

  ctx.fillStyle = '#ffffff'; ctx.font = '700 112px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText(fmtTime(state.elapsed), CW / 2, 130);

  ctx.fillStyle = '#ffd166'; ctx.font = '600 36px system-ui, sans-serif';
  ctx.fillText('Level ' + state.level + '  ·  ' + speedFor(state.level).toFixed(1) + ' m/s  ·  Passed ' + state.passed,
    CW / 2, 200);

  buttons.forEach(b => {
    const hov = state.hovered === b.id;
    let base = '#24324d';
    let label = b.label;
    if (b.id === 'toggle') {
      label = state.mode === 'running' ? 'PAUSE' : state.mode === 'paused' ? 'RESUME' : 'START';
      base = state.mode === 'running' ? '#f4a261' : '#2a9d58';
    }
    if (b.id === 'slower' && state.level <= CONFIG.minLevel) base = '#1a2236';
    if (b.id === 'faster' && state.level >= CONFIG.maxLevel) base = '#1a2236';
    ctx.fillStyle = hov ? '#4cc9f0' : base;
    rr(b.x, b.y, b.w, b.h, 22); ctx.fill();
    ctx.fillStyle = hov ? '#0b1220' : '#ffffff';
    ctx.font = (b.id === 'toggle' ? '800 62px' : '700 34px') + ' system-ui, sans-serif';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 2);
  });
  panelTex.needsUpdate = true;
}
drawPanel();

function pressButton(id) {
  switch (id) {
    case 'toggle':
      state.mode = state.mode === 'running' ? 'paused' : 'running';
      break;
    case 'slower': state.level = Math.max(CONFIG.minLevel, state.level - 1); break;
    case 'faster': state.level = Math.min(CONFIG.maxLevel, state.level + 1); break;
    case 'reset':
      state.mode = 'idle'; state.elapsed = 0; state.passed = 0; state.spawnTimer = 0;
      clearObstacles();
      break;
    case 'recenter': state.needsPlace = true; break;
  }
  drawPanel();
}

/* ============================== CONTROLLERS / POINTING ============================== */
const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4();
const controllers = [];

function pickButton(ctrl) {
  tmpMat.identity().extractRotation(ctrl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
  const hit = raycaster.intersectObject(panel, false)[0];
  if (!hit || !hit.uv) return { id: null, dist: null };
  const cx = hit.uv.x * CW, cy = (1 - hit.uv.y) * CH;
  const b = buttons.find(b => cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
  return { id: b ? b.id : null, dist: hit.distance };
}

for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);       // works for controllers and hand pinch (select)
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.8 })
  );
  line.scale.z = 2; line.name = 'ray';
  c.add(line);
  c.addEventListener('select', () => {
    const { id } = pickButton(c);
    if (id) pressButton(id);
  });
  c.addEventListener('connected', () => { c.visible = true; });
  c.addEventListener('disconnected', () => { c.visible = false; });
  scene.add(c);
  controllers.push(c);
}

/* ============================== PLACEMENT ============================== */
const _p = new THREE.Vector3(), _d = new THREE.Vector3();
function placeWorld() {
  const cam = renderer.xr.getCamera();
  cam.getWorldPosition(_p);
  cam.getWorldDirection(_d);
  if (_p.y < 0.3) return;                        // tracking not ready yet
  const yaw = Math.atan2(-_d.x, -_d.z);
  world.position.set(_p.x, 0, _p.z);
  world.rotation.set(0, yaw, 0);
  panel.position.set(0, Math.max(0.9, _p.y + CONFIG.panelHeightOffset), -CONFIG.panelDistance);
  panel.rotation.set(-0.12, 0, 0);
  state.needsPlace = false;
}

/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (renderer.xr.isPresenting) {
    if (state.needsPlace) placeWorld();

    // hover feedback + ray length
    let hovered = null;
    controllers.forEach(c => {
      const ray = c.getObjectByName('ray');
      const { id, dist } = pickButton(c);
      ray.scale.z = dist ? dist : 2;
      if (id) hovered = id;
    });
    if (hovered !== state.hovered) { state.hovered = hovered; drawPanel(); }
  }

  if (state.mode === 'running') {
    state.elapsed += dt;
    const speed = speedFor(state.level);

    state.spawnTimer += dt;
    if (state.spawnTimer >= intervalFor(state.level)) {
      state.spawnTimer = 0;
      spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += speed * dt;                 // slide along the floor toward the player's feet
      o.userData.age += dt;
      o.scale.setScalar(Math.min(1, 0.01 + o.userData.age / 0.35));
      if (o.position.z > CONFIG.despawnZ) {
        world.remove(o); obstacles.splice(i, 1); state.passed++;
        lastTimerText = ''; // force redraw
      }
    }

    const t = fmtTime(state.elapsed) + '|' + state.passed;
    if (t !== lastTimerText) { lastTimerText = t; drawPanel(); }
  }

  renderer.render(scene, camera);
});

/* ============================== SESSION ============================== */
const enterBtn = document.getElementById('enter');
const msg = document.getElementById('msg');
const ui = document.getElementById('ui');
let currentSession = null;

async function checkSupport() {
  if (!navigator.xr) {
    enterBtn.textContent = 'WebXR not available';
    msg.textContent = 'Open this page over HTTPS in the Meta Quest Browser.';
    return;
  }
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    if (ok) { enterBtn.disabled = false; enterBtn.textContent = 'Enter Mixed Reality'; }
    else { enterBtn.textContent = 'Immersive AR not supported'; msg.textContent = 'Use a Quest 3 / Quest 3S with the Meta Quest Browser.'; }
  } catch (e) {
    enterBtn.textContent = 'Could not check XR support'; msg.textContent = String(e);
  }
}
checkSupport();

enterBtn.addEventListener('click', async () => {
  msg.textContent = '';
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking']
    });
    currentSession = session;
    session.addEventListener('end', () => {
      currentSession = null;
      renderer.domElement.style.display = 'none';
      ui.style.display = 'flex';
      state.mode = 'idle'; state.elapsed = 0; state.passed = 0; state.spawnTimer = 0;
      clearObstacles(); drawPanel();
    });
    await renderer.xr.setSession(session);
    state.needsPlace = true;
    renderer.domElement.style.display = 'block';
    ui.style.display = 'none';
  } catch (e) {
    msg.textContent = 'Could not start MR: ' + e.message;
  }
});

addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
